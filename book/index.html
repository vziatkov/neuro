<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Graphics Lab</title>
    <link rel="stylesheet" href="./book.css" />
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <h1>Graphics Lab</h1>
        <nav id="chapters-nav" aria-label="Chapters"></nav>
      </aside>

      <main class="content">
        <h2 id="chapter-title">Loading...</h2>
        <p id="chapter-subject" class="subject"></p>
        <section class="lab-panel" aria-label="Interactive canvas example">
          <div class="lab-panel-header">
            <span id="canvas-example-title">Canvas example</span>
            <span class="lab-panel-badge">Canvas2D</span>
          </div>
          <canvas id="chapter-canvas" width="960" height="420"></canvas>
          <div id="candles-data-panel" class="data-panel" hidden>
            <div id="market-data-controls" class="market-data-controls" hidden>
              <label>
                Symbol
                <input id="market-symbol-input" value="BTCUSDT" />
              </label>
              <label>
                Interval
                <select id="market-interval-input">
                  <option value="15m">15m</option>
                  <option value="1h" selected>1h</option>
                  <option value="4h">4h</option>
                  <option value="1d">1d</option>
                </select>
              </label>
              <button id="load-market-data-button" type="button">Load Binance REST</button>
            </div>
            <label class="data-panel-label" for="candles-data-input">Candles JSON</label>
            <textarea id="candles-data-input" spellcheck="false"></textarea>
            <p id="candles-data-status" class="data-panel-status"></p>
          </div>
        </section>
        <article id="chapter-body"></article>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="./book.js" type="module"></script>
  </body>
</html>
